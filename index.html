function api(body, ok, bad){

function render(F, step, intro){

    if (it.ty === "SECTION_HEADER" || it.ty === "PAGE_BREAK"){ var s = el("div","card sec"); if (it.t) s.appendChild(el("div","q",it.t)); if (it.h) s.appendChild(el("div","h",it.h)); app.appendChild(s); all.push({pg:it.pg, cd:s}); return; }

function vis(R){
  var F = R.F, seen = {}, cur = 0, g = 0;
  while (cur < F.pages && !seen[cur] && g < 60){
